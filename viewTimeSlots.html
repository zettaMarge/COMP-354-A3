<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Time Slots</title>
    <link rel="stylesheet" href="css/viewTimeSlots.css">
    <link rel="stylesheet" href="css/cancelAppointment.css">
</head>
<body>
    <h1>Choose a date to book an appointment</h1>
    <hr>

    <!--Calendar-->
    <div id="calendar">

        <div class="calendarHeader">

            <button id="previousMonthBtn">previous month</button>

            <h2 id="monthYear"></h2>

            <button id="nextMonthBtn">next month</button>
        </div>

        <!--Days of the week heading-->
        <div class="daysOfTheWeek">
            <div>sunday</div>
            <div>monday</div>
            <div>tuesday</div>
            <div>wednesday</div>
            <div>thursday</div>
            <div>friday</div>
            <div>saturday</div>
        </div>

        <!--generate calendar days here-->
        <div id="calendarDays"></div>

    </div>

    <!--Available time slots-->
    <div id="availableSlots" hidden>
        <h2>Available Appointment Times</h2>

        <div id="timeSlots"></div>
    </div>

    <!-- Patient's appointments -->
     <div class="appointment">
        <h2>Your Appointments</h2>

        <!-- Temporary appointment for testing -->
        <p><strong>Date:</strong>&nbsp;<span id="appointmentDate"></span></p>
        <p><strong>Time:</strong>&nbsp;<span id="appointmentTime"></span></p>
        <p><strong>Status:</strong>&nbsp;<span id="appointmentStatus"></span></p>

        <!-- Cancel appointment button -->
         <button type="button" id="cancelButton">Cancel Appointment</button>

         <!-- Cancellation message -->
          <p id="cancelMessage"></p>
     </div>

    <!--Script-->
    <script type="module" src="js/viewTimeSlots.js"></script>
    <script type="module" src="js/cancelAppointment.js"></script>
    
</body>
</html>
